name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files Automatically
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle Wrapper
        run: |
          flutter create --org dz.energetic --project-name energetic_life_manager --platforms=android .

      - name: Install Dependencies & Build APKs
        run: |
          flutter pub get
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: energetic-life-manager-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
