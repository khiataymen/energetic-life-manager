name: energetic_life_manager
description: Complete Personal Life & Study Manager for Master 1 Energetic Mechanics Student in Algeria (DZD) - Phase C Final.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  android_alarm_manager_plus: ^4.0.3
  flutter_foreground_task: ^8.10.0
  record: ^5.1.2
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  http: ^1.2.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.1
  timezone: ^0.9.4
  uuid: ^4.4.0
  intl: ^0.20.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
