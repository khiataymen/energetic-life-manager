
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Java Versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android Platform Files
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android \
              --org dz.energetic \
              --project-name energetic_life_manager .
          fi

      - name: Install Dependencies
        run: flutter pub get -v

      - name: Build Debug APK
        run: flutter build apk --debug -v

      - name: Build Release APK
        run: flutter build apk --release -v

      - name: Upload APK Files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: energetic-life-manager-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
